<div class="modal-backdrop hidden" id="selfPasswordModal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="selfPasswordModalTitle">
        <div class="modal-head">
            <div>
                <p class="eyebrow">Conta</p>
                <h2 id="selfPasswordModalTitle">Alterar senha</h2>
            </div>
            <button type="button" class="modal-close" id="selfPasswordModalClose" aria-label="Fechar">&times;</button>
        </div>

        <form id="selfPasswordForm" action="{{ url_for('auth.change_password') }}" method="POST" data-api-method="PATCH">
            <p class="modal-user">Usuario: <strong>{{ session["nome"] or session["usuario"] }}</strong></p>

            <label class="field-label" for="selfSenhaAtual">Senha atual</label>
            <input id="selfSenhaAtual" name="senha_atual" type="password" autocomplete="current-password" required>

            <label class="field-label" for="selfNovaSenha">Nova senha</label>
            <input id="selfNovaSenha" name="nova_senha" type="password" autocomplete="new-password" minlength="8" required>

            <label class="field-label" for="selfConfirmarSenha">Confirmar senha</label>
            <input id="selfConfirmarSenha" name="confirmar_senha" type="password" autocomplete="new-password" minlength="8" required>

            <div class="form-actions">
                <button type="button" class="secondary-action" id="selfPasswordModalCancel">Cancelar</button>
                <button type="submit" class="primary-action">Salvar senha</button>
            </div>
        </form>
    </div>
</div>
