<div class="user-panel" data-username="{{ session['nome'] or session['usuario'] }}">
    <div class="user-menu">
        <button class="user-menu-trigger" id="userMenuTrigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="userMenuPanel">
            <span class="user-menu-avatar" aria-hidden="true">{{ (session["nome"] or session["usuario"])[:1]|upper }}</span>
            <span class="user-menu-name">{{ session["nome"] or session["usuario"] }}</span>
            <svg class="user-menu-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"></path></svg>
        </button>

        <div class="user-menu-panel hidden" id="userMenuPanel" role="menu">
            <button class="user-menu-item theme-toggle" id="themeToggle" type="button" role="menuitem" aria-label="Alternar tema claro ou escuro">
                <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <line x1="12" y1="2" x2="12" y2="4"></line>
                    <line x1="12" y1="20" x2="12" y2="22"></line>
                    <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
                    <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
                    <line x1="2" y1="12" x2="4" y2="12"></line>
                    <line x1="20" y1="12" x2="22" y2="12"></line>
                    <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
                    <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
                </svg>
                <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span id="themeLabel">Modo escuro</span>
            </button>

            <button class="user-menu-item" type="button" role="menuitem" data-open-self-password>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Alterar senha
            </button>

            <form class="user-menu-item-form logout-form" action="{{ url_for('auth.logout') }}" method="POST" data-login-url="{{ url_for('auth_pages.login_page') }}">
                <button class="user-menu-item" type="submit" role="menuitem">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
                    Sair
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    (function () {
        const trigger = document.getElementById("userMenuTrigger");
        const panel = document.getElementById("userMenuPanel");
        if (!trigger || !panel) return;

        function closeMenu() {
            panel.classList.add("hidden");
            trigger.setAttribute("aria-expanded", "false");
        }

        function openMenu() {
            panel.classList.remove("hidden");
            trigger.setAttribute("aria-expanded", "true");
        }

        trigger.addEventListener("click", (event) => {
            event.stopPropagation();
            if (panel.classList.contains("hidden")) {
                openMenu();
            } else {
                closeMenu();
            }
        });

        panel.addEventListener("click", (event) => {
            if (event.target.closest(".theme-toggle")) return;
            closeMenu();
        });

        document.addEventListener("click", (event) => {
            if (!panel.contains(event.target) && event.target !== trigger) {
                closeMenu();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeMenu();
        });
    })();
</script>
